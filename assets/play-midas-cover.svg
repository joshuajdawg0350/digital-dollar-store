<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1120" viewBox="0 0 1920 1120">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0d2c4d"/>
      <stop offset="55%" stop-color="#081018"/>
      <stop offset="100%" stop-color="#05080e"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fa"/>
      <stop offset="38%" stop-color="#c3ccd6"/>
      <stop offset="52%" stop-color="#7e8a99"/>
      <stop offset="66%" stop-color="#d7dee7"/>
      <stop offset="100%" stop-color="#8b98a8"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7dee7"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1920" height="1120" fill="url(#glow)"/>
  <ellipse cx="960" cy="430" rx="620" ry="300" fill="#0096FF" opacity="0.20" filter="url(#soft)"/>

  <!-- card: King of spades (behind, rotated) -->
  <g transform="translate(1058,150) rotate(13 190 270)">
    <rect x="0" y="0" width="380" height="540" rx="30" fill="url(#cardface)" stroke="#8b98a8" stroke-width="4"/>
    <text x="34" y="118" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="800" fill="#10151c">K</text>
    <text x="30" y="238" font-family="Arial,Helvetica,sans-serif" font-size="104" fill="#10151c">&#9824;</text>
    <text x="196" y="430" font-family="Arial,Helvetica,sans-serif" font-size="250" fill="#10151c" opacity="0.88">&#9824;</text>
  </g>
  <!-- card: Ace of spades (front) -->
  <g transform="translate(500,120) rotate(-9 190 270)">
    <rect x="0" y="0" width="380" height="540" rx="30" fill="url(#cardface)" stroke="#8b98a8" stroke-width="4"/>
    <text x="34" y="118" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="800" fill="#10151c">A</text>
    <text x="30" y="238" font-family="Arial,Helvetica,sans-serif" font-size="104" fill="#10151c">&#9824;</text>
    <text x="196" y="430" font-family="Arial,Helvetica,sans-serif" font-size="250" fill="#10151c" opacity="0.88">&#9824;</text>
  </g>

  <text x="960" y="838" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="172" font-weight="900" letter-spacing="4" fill="url(#chrome)">PLAY MIDAS</text>
  <text x="960" y="952" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="700" letter-spacing="10" fill="#5db9ff">10 HANDS &#183; HEADS-UP &#183; FREE</text>
  <text x="960" y="1032" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="600" fill="#9fb0c0">Then he reads your game.</text>
</svg>
