<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hustle City Pinochle™ — J-Dawgs Industries</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme: dark;
  --bg:#05080e; --panel:#10151f; --panel2:#151c29;
  --line:#263144; --line2:#33435e;
  --ink:#eef2f8; --mut:#9fb0c6; --dim:#6d7f97;
  --cyan:#39c2ff; --green:#3ddc84; --red:#ff5d5d; --gold:#ffd34d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:15px;line-height:1.45;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(ellipse 90% 340px at 50% -80px, rgba(57,194,255,.13), transparent 70%);
}
.hidden{display:none!important}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
  border-radius:12px;padding:11px 18px;font-weight:800;font-size:16px;letter-spacing:.02em;min-height:48px}
.btn:disabled{opacity:.38;cursor:default}
.btn.gold{background:linear-gradient(180deg,#eef5fd,#a9c2dc 55%,#7e9cbd);color:#0a0f16;border-color:#39c2ff;box-shadow:0 0 0 1px rgba(57,194,255,.30),0 8px 24px rgba(0,0,0,.5)}
.btn.big{min-height:56px;font-size:18px;border-radius:13px;letter-spacing:.04em}
.btn.danger{border-color:#7a3b3b;color:#ff9a9a}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--panel2);color:var(--mut);
  border-radius:9px;min-width:42px;min-height:38px;font-size:15px;font-weight:700;padding:4px 10px}
.chrome{font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:.95;
  background:linear-gradient(180deg,#fdfeff 0%,#e6eef7 30%,#8fa5bd 49%,#eef4fb 52%,#aebfd4 72%,#f4f8fc 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
@font-face{font-family:"Bebas Neue";src:url(assets/fonts/bebas-neue.woff2) format("woff2");font-weight:400;font-display:swap}
.bebas{font-family:"Bebas Neue","Archivo",sans-serif;letter-spacing:.05em}

/* ---------- brand bar ---------- */
.brandbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 10px 5px}
.brandbar .bt{font-size:16px;letter-spacing:.12em;margin-right:auto;white-space:nowrap;overflow:hidden}
.brandbar .bt .sp{color:var(--cyan);-webkit-text-fill-color:var(--cyan)}

/* ---------- score HUD ---------- */
.hud{flex:0 0 auto;background:linear-gradient(180deg,#0d1219,#0a0e14);border-bottom:1px solid var(--line2);padding:6px 10px;display:flex;align-items:stretch;gap:8px}
.stat{flex:1;display:flex;flex-direction:column;justify-content:center;background:#010204;border:1px solid var(--line);border-radius:10px;box-shadow:inset 0 0 18px rgba(0,0,0,.9);padding:4px 10px 5px;text-align:center;min-width:0;overflow:hidden}
.stat .lab{font-weight:700;letter-spacing:.2em;font-size:10.5px;color:var(--dim);text-transform:uppercase}
.stat .val{font-weight:900;font-size:clamp(19px,5.6vw,24px);line-height:1.1;color:var(--cyan);text-shadow:0 0 10px rgba(57,194,255,.55);white-space:nowrap}
.stat .val.sm{font-size:14.5px}

/* ---------- main column ---------- */
.pn-main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;padding:6px 10px 64px;max-width:560px;width:100%;margin:0 auto}
.seat{display:flex;align-items:center;gap:8px;min-width:0}
.seat .who{font-weight:700;letter-spacing:.13em;font-size:12.5px;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.seat .who b{color:var(--ink)}
.avatar{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#eaf4ff;background:radial-gradient(circle at 32% 26%,#2c3a50,#0c1320 72%);border:2px solid #5f7189;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.avatar.av-sm{width:28px;height:28px;font-size:12.5px;border-width:1.5px}
.avatar.av-you{color:var(--cyan);border-color:rgba(57,194,255,.55)}
.seat.turn .avatar{border-color:var(--cyan);box-shadow:0 0 13px rgba(57,194,255,.55),inset 0 1px 0 rgba(255,255,255,.28)}
.seat.turn .who{color:var(--cyan)}
.seat .pchip{margin-left:auto;background:#010204;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-weight:700;font-size:11.5px;letter-spacing:.04em;color:var(--cyan);white-space:nowrap}
.seat .backs{color:var(--dim);font-size:12px;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.seat .backs .cbacks{display:inline-flex;margin-right:2px;vertical-align:-5px}
.seat .backs .cbacks i{width:16px;height:23px;border-radius:2.5px;margin-left:-6px;background:url(deck/BACK.webp) center/cover no-repeat;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.seat .backs .cbacks i:first-child{margin-left:0}
.midrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.midrow .seat.right{flex-direction:row-reverse}
.midrow .seat.right .pchip{margin-left:0;margin-right:auto}

/* ---------- the table ---------- */
.tablewrap{position:relative;flex:0 1 auto;height:min(300px,35dvh);min-height:140px;border-radius:50%/58%;
  background:
    radial-gradient(ellipse 62% 58% at 50% 46%, rgba(23,86,140,.55), rgba(10,32,58,0) 78%),
    radial-gradient(ellipse at 50% 45%, #10324f 0%, #0a2036 55%, #050d18 100%);
  border:3px solid #46586f;
  box-shadow:0 0 0 2px #101823, 0 0 0 4px rgba(57,194,255,.14), inset 0 0 44px rgba(0,0,0,.72), 0 14px 30px rgba(0,0,0,.55)}
.pn-main:has(#panel:not(:empty)) .tablewrap{height:min(215px,25dvh);min-height:112px}
.table-emblem{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:3px}
.table-emblem .te-mark{font-size:44px;line-height:1;color:rgba(140,210,255,.10)}
.table-emblem .te-word{font-weight:900;font-size:12px;letter-spacing:.28em;margin-left:.28em;text-transform:uppercase;color:rgba(180,220,255,.13)}
.slot{position:absolute;width:52px;height:74px;border-radius:8px}
.slot.s-bottom{left:50%;bottom:7%;transform:translateX(-50%)}
.slot.s-top{left:50%;top:7%;transform:translateX(-50%)}
.slot.s-left{left:6%;top:50%;transform:translateY(-50%)}
.slot.s-right{right:6%;top:50%;transform:translateY(-50%)}
.slot:empty{border:1.5px dashed rgba(120,170,220,.16)}
.slot.win{filter:drop-shadow(0 0 10px rgba(57,194,255,.65))}
.mcard{width:52px;height:74px;border-radius:8px}
@keyframes hcdFlip{from{transform:rotateY(84deg) rotateX(7deg) translateY(-7px);opacity:.25}to{transform:rotateY(0deg) rotateX(5deg) translateY(0);opacity:1}}
.mcard.hcd{background:none;border:none;padding:0;
  box-shadow:1px 1px 0 #39445a,2px 2px 0 #2b3448,3px 3px 0 #1d2536,0 10px 16px rgba(0,0,0,.5);
  animation:hcdFlip .45s cubic-bezier(.2,.7,.3,1.15) both}
.hcd-img{width:100%;height:100%;display:block;border-radius:inherit}

/* ---------- call line ---------- */
#pn-call{flex:0 0 auto;text-align:center;font-weight:700;font-size:16px;color:#57ccff;min-height:24px;text-shadow:0 0 12px rgba(57,194,255,.25)}
#pn-call.warn{color:var(--gold)}

/* ---------- action panel ---------- */
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panelbox{flex:0 0 auto;background:linear-gradient(165deg,#131c2c,#070b13);border:1.5px solid rgba(150,180,220,.35);border-radius:12px;padding:10px 12px;box-shadow:0 8px 20px rgba(0,0,0,.5);animation:panelIn .22s ease-out}
.panelbox:empty{display:none}
.panelbox .pt{font-family:"Bebas Neue","Archivo",sans-serif;font-weight:400;font-size:24px;text-transform:uppercase;letter-spacing:.05em;
  background:linear-gradient(180deg,#fdfeff 0%,#e6eef7 30%,#8fa5bd 49%,#eef4fb 52%,#aebfd4 72%,#f4f8fc 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.panelbox .ps{color:var(--mut);font-size:14px;margin:3px 0 9px;line-height:1.4}
.panelbox .ps b{color:var(--ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
select.bidsel{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;min-height:48px;font-size:17px;font-weight:800;padding:0 12px;font-family:inherit}
.suitgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.suitbtn{flex-direction:column;gap:0;min-height:62px;font-size:26px;line-height:1.05;min-width:0;padding:10px 2px}
.suitbtn small{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.suitbtn.red{color:#ff8f8f}.suitbtn:disabled{opacity:.3}
.scorelines{display:grid;gap:5px;margin:4px 0 10px}
.sl{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:15px}
.sl b.pos{color:var(--green)} .sl b.neg{color:var(--red)}
.meldlines{font-size:13.5px;color:var(--mut);display:grid;gap:3px;margin:2px 0 8px}
.meldlines b{color:var(--ink)}
.meldlines .ml{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed rgba(120,160,210,.14);padding:2px 0}

/* ---------- your hand ---------- */
#pn-youarea{margin-top:auto;flex:0 0 auto}
.myhand{display:flex;flex-wrap:wrap;justify-content:center;row-gap:5px;min-height:0;max-width:460px;margin:2px auto 0;padding-top:6px}
.hcard{position:relative;width:50px;height:70px;margin-left:-17px;border-radius:8px;border:1px solid rgba(120,160,210,.35);padding:0;background:#0a0f16;overflow:visible;
  box-shadow:0 4px 10px rgba(0,0,0,.5);transition:transform .12s ease, box-shadow .12s ease}
.hcard:first-child{margin-left:0}
.hcard img{width:100%;height:100%;display:block;border-radius:8px}
.hcard.legal{transform:translateY(-7px);border-color:var(--cyan);box-shadow:0 0 0 1.5px rgba(57,194,255,.55),0 10px 18px rgba(0,0,0,.5)}
.hcard.illegal{opacity:.45}
.hcard.sel{transform:translateY(-13px);border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,211,77,.7),0 12px 20px rgba(0,0,0,.55)}
.hcard:active{transform:translateY(-11px)}
.hcard .copybdg{position:absolute;right:-4px;bottom:-4px;min-width:17px;height:17px;border-radius:50%;background:#0d1624;border:1.5px solid var(--cyan);color:#bfe6ff;
  font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px;z-index:3}
.hcard .newbdg{position:absolute;left:-4px;top:-6px;background:var(--cyan);color:#04121f;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:.05em;padding:1px 4px;z-index:3}

/* ---------- drag sheet (score / meld / rules) ---------- */
#sheet{position:fixed;left:50%;transform:translate(-50%,calc(100% - 54px));bottom:0;width:min(560px,100%);height:80dvh;z-index:40;
  background:linear-gradient(180deg,#131c2c,#070b13);border:1.5px solid rgba(150,180,220,.4);border-bottom:none;border-radius:16px 16px 0 0;
  box-shadow:0 -12px 34px rgba(0,0,0,.6);display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.3,.8,.3,1)}
#sheet .handle{flex:0 0 auto;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:grab;touch-action:none;padding-top:6px}
#sheet .handle .bar{width:52px;height:5px;border-radius:99px;background:#5f7189}
#sheet .handle .hlab{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
#sheet .tabs{flex:0 0 auto;display:flex;gap:6px;padding:0 12px 8px}
#sheet .tabs .btn{min-height:40px;padding:6px 10px;font-size:14px;flex:1}
#sheet .tabs .btn.on{border-color:var(--cyan);color:#57ccff}
#sheet .sbody{flex:1 1 auto;overflow-y:auto;padding:2px 14px 18px;font-size:14.5px;color:#dbe6f4;line-height:1.5}
#sheet .sbody h3{font-family:"Bebas Neue","Archivo",sans-serif;font-weight:400;letter-spacing:.05em;font-size:20px;margin:10px 0 4px;color:#fff}
#sheet .sbody table{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 10px}
#sheet .sbody td,#sheet .sbody th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
#sheet .sbody td:last-child,#sheet .sbody th:last-child{text-align:right;font-weight:800;color:var(--cyan)}
#sheet .sbody li{margin:5px 0}
#sheet .sbody .copy{color:var(--dim);font-size:12px;margin-top:10px}

@media (max-height:780px){
  .hcard{width:45px;height:63px;margin-left:-15px}
  .hcard:first-child{margin-left:0}
  .slot,.mcard{width:45px;height:63px}
  .brandbar{padding:5px 10px 3px}
  .brandbar .bt{font-size:14.5px}
  .hud{padding:4px 10px}
  .pn-main{gap:4px;padding:4px 10px 60px}
  #pn-call{font-size:15px;min-height:22px}
  .panelbox{padding:8px 10px}
  .panelbox .pt{font-size:21px}
  .table-emblem .te-mark{font-size:34px}
}
</style>
</head>

<header class="brandbar">
  <div class="bt chrome"><span class="sp">♠</span> Hustle City Pinochle™</div>

  <div class="midrow">
    <div class="seat" id="seat-1"><span class="avatar av-sm">R</span><span class="who"><b>Rex</b></span><span class="pchip" id="chip-1">—</span></div>
    <div></div>
    <div class="seat right" id="seat-3"><span class="avatar av-sm">S</span><span class="who"><b>Slim</b></span><span class="pchip" id="chip-3">—</span></div>
  </div>
  <div class="tablewrap" id="pn-table">
    <div class="table-emblem"><div class="te-mark">♠♥</div><div class="te-word">Hustle City</div></div>

<script src="logic.js"></script>
<script>
"use strict";
/* ================= HUSTLE CITY PINOCHLE — game =================
   You + Ace (AI partner) vs Rex + Slim (AI). Double-deck, no nines.
   Ruleset: see logic.js header and the in-game Rules sheet.        */
(function(){
const L = window.PinochleLogic;
const $ = s => document.querySelector(s);
const NAMES = ["You","Rex","Ace","Slim"];
const teamOf = p => p % 2;                 // 0 = You+Ace, 1 = Rex+Slim
const partnerOf = p => (p + 2) % 4;
const SAVE_KEY = "hcc-pinochle-v1";
let G = null;
let seq = 0;
function later(fn, ms){ const t = ++seq; setTimeout(()=>{ if(t === seq) fn(); }, ms); }
function storeGet(k){ try{ const v = localStorage.getItem(k); return v===null?null:JSON.parse(v); }catch(e){ return null; } }
function storeSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function save(){ if(G) storeSet(SAVE_KEY, G); }
let actx = null;
function clickSnd(f){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f || 660;
  g.gain.setValueAtTime(.045, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .07);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + .08); }catch(e){} }
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }

/* ---------------- state ---------------- */
function newMatch(){
  G = { phase:"idle", scores:[0,0], hand:1, dealer:3, hands:[[],[],[],[]],
    dealerSeed: (Date.now() % 2147483647) || 7,
    currentBid:0, highBidder:-1, passed:[false,false,false,false], turn:0,
    trump:null, declarer:-1, passStage:null, selected:[], passReceived:[],
    melds:null, meldTeamRaw:[0,0], trick:[], tricksWon:[0,0,0,0],
    teamTricks:[0,0], trickNo:0, captured:[[],[]],
    lastResult:null, history:[], winner:-1, callMsg:"", callWarn:false };
  save();
}
function sortHand(p){
  const order = G.trump ? [G.trump, ...L.SUITS.filter(s => s !== G.trump)] : L.SUITS;
  const si = s => order.indexOf(s);
  G.hands[p].sort((a,b)=> si(a.suit)-si(b.suit) || L.STRENGTH[b.rank]-L.STRENGTH[a.rank] || a.copy-b.copy);
}
function sortAll(){ for(let p=0;p<4;p++) sortHand(p); }
function deal(){
  const rng = mulberry32(G.dealerSeed + G.hand * 7919);
  const deck = L.buildDeck();
  for(let i = deck.length-1; i > 0; i--){ const j = Math.floor(rng() * (i+1)); const t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  G.hands = [[],[],[],[]];
  deck.forEach((c,i)=> G.hands[i % 4].push(c));
  G.currentBid = 0; G.highBidder = -1; G.passed = [false,false,false,false];
  G.trump = null; G.declarer = -1; G.passStage = null; G.selected = []; G.passReceived = [];
  G.melds = null; G.meldTeamRaw = [0,0]; G.trick = []; G.tricksWon = [0,0,0,0];
  G.teamTricks = [0,0]; G.trickNo = 0; G.captured = [[],[]]; G.lastResult = null;
  G.phase = "auction"; G.turn = (G.dealer + 1) % 4;
  sortAll();
  setCall("Hand " + G.hand + " — auction open. " + NAMES[G.turn] + " to speak.");
  save(); render(); maybeAI();
}
function setCall(msg, warn){ G.callMsg = msg; G.callWarn = !!warn; const el = $("#pn-call"); if(el){ el.textContent = msg; el.className = warn ? "warn" : ""; el.id = "pn-call"; } }

/* ---------------- AI estimation ---------------- */
function marriageSuits(hand){ return L.SUITS.filter(s => L.countIf(hand,s,"K") > 0 && L.countIf(hand,s,"Q") > 0); }
function trickEst(hand, trump){
  let v = 0, nTrump = 0;
  for(const c of hand){
    if(c.suit === trump){ nTrump++;
      v += {A:3.2,"10":2.6,K:1.6,Q:0.7,J:0.4}[c.rank];
    } else v += {A:2.6,"10":1.4,K:0.6,Q:0.1,J:0}[c.rank];
  }
  if(nTrump > 6) v += (nTrump - 6) * 0.8;
  return v;
}
function bestTrumpFor(hand){
  let best = null;
  for(const s of marriageSuits(hand)){
    const v = L.computeMeld(hand, s).total + trickEst(hand, s);
    if(!best || v > best.v) best = { suit:s, v, meld: L.computeMeld(hand, s).total };
  }
  return best;
}
function aiBidCap(hand){
  const bt = bestTrumpFor(hand);
  if(!bt) return 0;
  const total = bt.meld + trickEst(hand, bt.suit) + 24;  // partner meld+tricks expectation
  if(total < 50) return 0;
  let cap = Math.floor(total);
  if(cap > 60) cap = Math.floor(cap / 5) * 5;
  return Math.min(cap, 200);
}
function aiDoBid(p){
  const cap = aiBidCap(G.hands[p]);
  const minBid = L.minLegalBid(G.currentBid);
  if(cap >= minBid) placeBid(p, minBid);
  else passBid(p);
}
function placeBid(p, v){
  G.currentBid = v; G.highBidder = p;
  setCall(NAMES[p] + " bid" + (p === 0 ? "" : "s") + " " + v + ".");
  advanceAuction();
}
function passBid(p){
  G.passed[p] = true;
  setCall(NAMES[p] + " pass" + (p === 0 ? "" : "es") + ".");
  advanceAuction();
}
function advanceAuction(){
  const passedCount = G.passed.filter(Boolean).length;
  if(G.highBidder >= 0 && passedCount === 3){ endAuction(G.highBidder); return; }
  if(G.highBidder < 0 && passedCount === 3){
    const last = G.passed.findIndex(x => !x);   // dealer stuck at 50
    G.currentBid = 50; G.highBidder = last;
    setCall("Everyone passed — " + NAMES[last] + " is stuck with the bid at 50.");
    endAuction(last); return;
  }
  let t = G.turn;
  do { t = (t + 1) % 4; } while(G.passed[t]);
  G.turn = t; save(); render(); maybeAI();
}
function endAuction(winner){
  G.declarer = winner; G.phase = "trump"; G.turn = winner;
  setCall(NAMES[winner] + " won the auction at " + G.currentBid + ". Naming trump…");
  save(); render(); maybeAI();
}
function aiPickTrump(p){
  const bt = bestTrumpFor(G.hands[p]);
  nameTrump(bt ? bt.suit : marriageSuits(G.hands[p])[0]);
}
function nameTrump(suit){
  const p = G.declarer;
  if(!marriageSuits(G.hands[p]).includes(suit)){ forfeitHand("nomarriage"); return; }
  G.trump = suit; sortAll();
  setCall(NAMES[p] + " names " + L.SUIT_NAME[suit] + " " + L.SUIT_GLYPH[suit] + " as trump. Partners exchange 4 cards.");
  startPass();
}
function startPass(){
  G.phase = "pass"; G.passStage = "toDeclarer"; G.selected = []; G.passReceived = [];
  save(); render(); maybeAI();
}
/* pass scoring: what the declarer wants to receive */
function receiveScore(c, hand){
  let s = c.suit === G.trump ? {A:14,"10":13,K:12,Q:11,J:10}[c.rank] : {A:9,"10":5,K:4,Q:2,J:1}[c.rank];
  if(L.countIf(hand, c.suit, c.rank) > 1) s += 1;
  return s;
}
/* keep scoring: what the declarer wants to hold on to when returning */
function keepScore(c, hand){
  let s = c.suit === G.trump ? {A:16,"10":15,K:14,Q:13,J:12}[c.rank] : {A:12,"10":8,K:6,Q:3,J:2}[c.rank];
  if(c.rank === "K" || c.rank === "Q"){
    const other = c.rank === "K" ? "Q" : "K";
    if(L.countIf(hand, c.suit, other) > 0) s += 3;                       // marriage pair
  }
  if(c.rank !== "10"){
    const suitsWith = L.SUITS.filter(x => L.countIf(hand, x, c.rank) > 0).length;
    if(suitsWith === 4) s += 4;                                          // around member
  }
  if(c.suit === "D" && c.rank === "J" && L.countIf(hand, "S", "Q") > 0) s += 4;  // pinochle part
  if(c.suit === "S" && c.rank === "Q" && L.countIf(hand, "D", "J") > 0) s += 4;
  return s;
}
function aiChoosePassCards(hand, mode){
  const scored = hand.map(c => ({ c, v: (mode === "receive" ? receiveScore(c, hand) : -keepScore(c, hand)) + Math.random() * 0.5 }));
  scored.sort((a,b)=> b.v - a.v);
  return scored.slice(0,4).map(x => x.c.id);
}
function moveCards(fromP, toP, ids){
  const from = G.hands[fromP];
  const moving = [];
  for(const id of ids){ const i = from.findIndex(c => c.id === id); if(i >= 0) moving.push(from.splice(i,1)[0]); }
  G.hands[toP].push(...moving);
  sortHand(fromP); sortHand(toP);
  return moving;
}
function doPassToDeclarer(ids){
  const partner = partnerOf(G.declarer);
  moveCards(partner, G.declarer, ids);
  G.passStage = "return"; G.selected = [];
  G.passReceived = G.declarer === 0 ? ids.slice() : [];
  setCall(NAMES[partner] + " passed 4 cards to " + NAMES[G.declarer] + ".");
  save(); render(); maybeAI();
}
function doPassReturn(ids){
  const partner = partnerOf(G.declarer);
  moveCards(G.declarer, partner, ids);
  G.passStage = null; G.passReceived = [];
  setCall("Cards exchanged. Laying down meld…");
  later(()=> computeMeldPhase(), 650);
  save(); render();
}
function computeMeldPhase(){
  G.phase = "meld";
  G.melds = [0,1,2,3].map(p => L.computeMeld(G.hands[p], G.trump));
  G.meldTeamRaw = [ G.melds[0].total + G.melds[2].total, G.melds[1].total + G.melds[3].total ];
  const bidTeam = teamOf(G.declarer);
  setCall("Meld is down. Us " + G.meldTeamRaw[0] + " · Them " + G.meldTeamRaw[1] + " (a side needs 20+ for its meld to count).");
  save(); render();
}
function eligibleMeld(team){ return G.meldTeamRaw[team] >= 20 ? G.meldTeamRaw[team] : 0; }
function beginPlay(){
  const bidTeam = teamOf(G.declarer);
  if(G.meldTeamRaw[bidTeam] < 20){ forfeitHand("lowmeld"); return; }
  G.phase = "play"; G.turn = G.declarer; G.trick = []; G.trickNo = 1;
  setCall(NAMES[G.declarer] + " leads the first trick.");
  save(); render(); maybeAI();
}
function forfeitHand(kind){
  const bidTeam = teamOf(G.declarer), defTeam = 1 - bidTeam;
  const delta = [0,0];
  delta[bidTeam] = -G.currentBid;
  let note = "";
  if(kind === "nomarriage"){ note = NAMES[G.declarer] + " held no marriage in any suit — no trump can be named. The hand is thrown in: bidding side loses the bid, nobody scores."; }
  else if(kind === "lowmeld"){ delta[defTeam] = G.melds ? eligibleMeld(defTeam) : 0; note = "The bidding side's meld is under 20 and does not count — the hand is forfeit. Bidding side loses the bid; defenders keep their meld (" + delta[defTeam] + ")."; }
  else if(kind === "throwin"){ delta[defTeam] = G.melds ? eligibleMeld(defTeam) : 0; note = NAMES[G.declarer] + " threw the hand in before the first lead. Bidding side loses the bid; defenders keep their meld (" + delta[defTeam] + ")."; }
  finishHand(delta, note, { forfeit: kind });
}
/* ---------------- trick play ---------------- */
function playCard(p, id){
  const hand = G.hands[p];
  const i = hand.findIndex(c => c.id === id);
  if(i < 0) return;
  const card = hand.splice(i,1)[0];
  G.trick.push({ p, card });
  clickSnd(520 + p * 60);
  if(G.trick.length === 4){
    G.phase = "trickpause";
    const w = G.trick[L.winningIndex(G.trick, G.trump)].p;
    setCall(NAMES[w] + " takes the trick.");
    save(); render();
    later(awardTrick, 1000);
  } else {
    G.turn = (p + 1) % 4;
    save(); render(); maybeAI();
  }
}
function awardTrick(){
  const w = G.trick[L.winningIndex(G.trick, G.trump)].p;
  const cards = G.trick.map(e => e.card);
  const pts = L.trickPoints(cards, G.trickNo === 20);
  G.teamTricks[teamOf(w)] += pts;
  G.tricksWon[w]++;
  G.captured[teamOf(w)].push(...cards);
  G.trick = [];
  if(G.trickNo === 20){ scoreFinishedHand(); return; }
  G.trickNo++; G.turn = w; G.phase = "play";
  setCall(NAMES[w] + " leads trick " + G.trickNo + ".");
  save(); render(); maybeAI();
}
function scoreFinishedHand(){
  const bidTeam = teamOf(G.declarer);
  const meld = [eligibleMeld(0), eligibleMeld(1)];
  const res = L.scoreHand(meld, G.teamTricks, bidTeam, G.currentBid);
  let note = "";
  if(res.made) note = NAMES[G.declarer] + "'s side made the " + G.currentBid + " bid: meld " + meld[bidTeam] + " + tricks " + G.teamTricks[bidTeam] + ".";
  else if(G.teamTricks[bidTeam] < 20) note = "Set — the bidding side took only " + G.teamTricks[bidTeam] + " trick points (20 needed to save anything). Bid comes off.";
  else note = "Set — meld " + meld[bidTeam] + " + tricks " + G.teamTricks[bidTeam] + " = " + (meld[bidTeam] + G.teamTricks[bidTeam]) + ", short of the " + G.currentBid + " bid. Bid comes off.";
  if(G.teamTricks[1 - bidTeam] < 20 && !res.made || G.teamTricks[1 - bidTeam] < 20) note += " Defenders took " + G.teamTricks[1 - bidTeam] + " trick points — under 20, so their meld is lost too.";
  finishHand(res.delta, note, { meld, tricks: G.teamTricks.slice() });
}
function finishHand(delta, note, extra){
  G.scores[0] += delta[0]; G.scores[1] += delta[1];
  G.lastResult = { delta, note, bid: G.currentBid, declarer: G.declarer, trump: G.trump,
    meldRaw: G.meldTeamRaw.slice(), meld: extra && extra.meld ? extra.meld : null,
    tricks: extra && extra.tricks ? extra.tricks : null, forfeit: extra && extra.forfeit || null };
  G.history.push({ hand: G.hand, bid: G.currentBid, declarer: G.declarer, trump: G.trump,
    meldRaw: G.meldTeamRaw.slice(), tricks: extra && extra.tricks ? extra.tricks : null, delta: delta.slice(), note });
  const bidTeam = teamOf(G.declarer);
  if(G.scores[0] >= 500 || G.scores[1] >= 500){
    G.winner = (G.scores[0] >= 500 && G.scores[1] >= 500) ? bidTeam : (G.scores[0] >= 500 ? 0 : 1);
    G.phase = "matchover";
    setCall(G.winner === 0 ? "🏆 You and Ace win the match!" : "Rex and Slim take the match.");
  } else {
    G.phase = "score";
    setCall("Hand " + G.hand + " is in the books.");
  }
  save(); render();
}
function nextHand(){
  G.hand++; G.dealer = (G.dealer + 1) % 4;
  deal();
}
/* ---------------- AI card play ---------------- */
function aiChooseCard(p){
  const hand = G.hands[p];
  const legal = L.legalCards(hand, G.trick, G.trump);
  const asc = arr => arr.slice().sort((a,b)=> L.STRENGTH[a.rank]-L.STRENGTH[b.rank] || L.COUNTER[a.rank]-L.COUNTER[b.rank]);
  const wouldWin = c => { const t = G.trick.concat([{ p, card: c }]); return t[L.winningIndex(t, G.trump)].p === p; };
  if(!G.trick.length){
    const sideAce = legal.find(c => c.rank === "A" && c.suit !== G.trump);
    if(sideAce) return sideAce;
    const trumpAce = legal.find(c => c.rank === "A" && c.suit === G.trump);
    if(trumpAce && hand.filter(c => c.suit === G.trump).length >= 6) return trumpAce;
    let bestSuit = null, bestLen = -1;
    for(const s of L.SUITS){ if(s === G.trump) continue; const n = hand.filter(c => c.suit === s).length; if(n > bestLen){ bestLen = n; bestSuit = s; } }
    const inSuit = legal.filter(c => c.suit === bestSuit);
    if(inSuit.length) return asc(inSuit)[0];
    return asc(legal)[0];
  }
  const winEntry = G.trick[L.winningIndex(G.trick, G.trump)];
  const partnerWinning = teamOf(winEntry.p) === teamOf(p);
  const trickCounters = G.trick.reduce((a,e)=> a + L.COUNTER[e.card.rank], 0);
  const wins = legal.filter(wouldWin);
  if(partnerWinning){
    if(wins.length && wins.length === legal.length) return asc(wins)[0];
    if(winEntry.card.rank === "A" || winEntry.card.suit === G.trump){
      const feed = asc(legal).find(c => L.COUNTER[c.rank] && !wouldWin(c));
      if(feed) return feed;
    }
    return asc(legal).find(c => !L.COUNTER[c.rank]) || asc(legal)[0];
  }
  if(wins.length){
    const cheap = asc(wins)[0];
    if(trickCounters >= 2 || G.trick.length === 3 || L.STRENGTH[cheap.rank] <= 3) return cheap;
    const duck = asc(legal).find(c => !wouldWin(c) && !L.COUNTER[c.rank]);
    if(duck) return duck;
    return cheap;
  }
  return asc(legal).find(c => !L.COUNTER[c.rank]) || asc(legal)[0];
}
/* ---------------- AI driver ---------------- */
function maybeAI(){
  if(!G) return;
  const phase = G.phase;
  if(phase === "auction" && G.turn !== 0) later(()=>{ if(G.phase === "auction" && G.turn !== 0) aiDoBid(G.turn); }, 620);
  else if(phase === "trump" && G.declarer !== 0) later(()=>{ if(G.phase === "trump") aiPickTrump(G.declarer); }, 700);
  else if(phase === "pass"){
    const partner = partnerOf(G.declarer);
    if(G.passStage === "toDeclarer" && partner !== 0)
      later(()=>{ if(G.phase === "pass" && G.passStage === "toDeclarer") doPassToDeclarer(aiChoosePassCards(G.hands[partner], "receive")); }, 750);
    else if(G.passStage === "return" && G.declarer !== 0)
      later(()=>{ if(G.phase === "pass" && G.passStage === "return") doPassReturn(aiChoosePassCards(G.hands[G.declarer], "return")); }, 750);
  }
  else if(phase === "play" && G.turn !== 0)
    later(()=>{ if(G.phase === "play" && G.turn !== 0){ const c = aiChooseCard(G.turn); playCard(G.turn, c.id); } }, 560);
}
/* ---------------- human actions ---------------- */
function humanBid(){
  const sel = $("#bid-amt"); if(!sel) return;
  placeBid(0, parseInt(sel.value, 10)); save(); render(); maybeAI();
}
function humanPassBid(){ passBid(0); save(); render(); maybeAI(); }
function toggleSelect(id){
  const i = G.selected.indexOf(id);
  if(i >= 0) G.selected.splice(i,1);
  else { if(G.selected.length >= 4){ setCall("Four cards only — tap a picked card to put it back.", true); render(); return; } G.selected.push(id); }
  clickSnd(700); save(); render();
}
function confirmPass(){
  if(G.selected.length !== 4) return;
  const ids = G.selected.slice(); G.selected = [];
  if(G.passStage === "toDeclarer") doPassToDeclarer(ids);
  else doPassReturn(ids);
}
/* ---------------- rendering ---------------- */
function chipText(p){
  if(G.phase === "auction") return G.passed[p] ? "Passed" : (G.highBidder === p ? "Bid " + G.currentBid : "—");
  if(G.phase === "trump" || G.phase === "pass") return p === G.declarer ? "Bid " + G.currentBid : "—";
  if(G.melds) return "Meld " + G.melds[p].total + " · Tr " + G.tricksWon[p];
  return "—";
}
function render(){
  if(!G) return;
  $("#pn-us").textContent = G.scores[0];
  $("#pn-them").textContent = G.scores[1];
  $("#pn-handlab").textContent = "Hand " + G.hand + (G.phase === "play" || G.phase === "trickpause" ? " · Trick " + G.trickNo + "/20" : "");
  $("#pn-mid").textContent = G.declarer >= 0
    ? "Bid " + G.currentBid + " · " + NAMES[G.declarer] + (G.trump ? " · " + L.SUIT_GLYPH[G.trump] + " trump" : "")
    : (G.currentBid ? "Bid " + G.currentBid : "First to 500");
  const el = $("#pn-call"); el.textContent = G.callMsg || ""; el.className = G.callWarn ? "warn" : "";
  const activeP = (G.phase === "auction" || G.phase === "play") ? G.turn : (G.phase === "trump" ? G.declarer : -1);
  for(let p = 0; p < 4; p++){
    $("#seat-" + p).classList.toggle("turn", p === activeP);
    $("#chip-" + p).textContent = chipText(p);
    const backs = $("#backs-" + p);
    if(backs){ const n = G.hands[p].length; backs.innerHTML = n ? '<span class="cbacks"><i></i><i></i><i></i></span>' + n : ""; }
    const slot = $("#slot-" + p);
    const entry = G.trick.find(e => e.p === p);
    const isWin = G.phase === "trickpause" && entry && G.trick[L.winningIndex(G.trick, G.trump)].p === p;
    slot.className = "slot " + ["s-bottom","s-left","s-top","s-right"][p] + (isWin ? " win" : "");
    slot.innerHTML = entry ? '<div class="mcard hcd"><img class="hcd-img" src="deck/' + entry.card.rank + entry.card.suit + '.webp" alt="' + L.cardName(entry.card) + '"></div>' : "";
  }
  renderHand(); renderPanel(); renderSheet();
}
function renderHand(){
  const wrap = $("#myhand"); const hand = G.hands[0];
  const inPass = G.phase === "pass" && ((G.passStage === "toDeclarer" && partnerOf(G.declarer) === 0) || (G.passStage === "return" && G.declarer === 0));
  let legalIds = null;
  if(G.phase === "play" && G.turn === 0) legalIds = new Set(L.legalCards(hand, G.trick, G.trump).map(c => c.id));
  const counts = {};
  for(const c of hand) counts[c.suit + c.rank] = (counts[c.suit + c.rank] || 0) + 1;
  wrap.innerHTML = hand.map(c => {
    let cls = "hcard";
    if(inPass && G.selected.includes(c.id)) cls += " sel";
    else if(legalIds) cls += legalIds.has(c.id) ? " legal" : " illegal";
    const dup = counts[c.suit + c.rank] > 1 ? '<span class="copybdg">' + (c.copy + 1) + '</span>' : "";
    const isNew = G.passReceived.includes(c.id) ? '<span class="newbdg">NEW</span>' : "";
    return '<button class="' + cls + '" data-card="' + c.id + '" aria-label="' + L.cardName(c) + '"><img src="deck/' + c.rank + c.suit + '.webp" alt="">' + dup + isNew + '</button>';
  }).join("");
  wrap.querySelectorAll("[data-card]").forEach(b => b.addEventListener("click", ()=>{
    const id = parseInt(b.getAttribute("data-card"), 10);
    if(inPass){ toggleSelect(id); return; }
    if(G.phase === "play" && G.turn === 0){
      const card = hand.find(c => c.id === id);
      if(legalIds.has(id)){ playCard(0, id); }
      else {
        const led = G.trick.length ? G.trick[0].card.suit : null;
        let why = "That card can't be played right now.";
        if(led && hand.some(c => c.suit === led) && card.suit !== led) why = "You hold " + L.SUIT_NAME[led] + " — you must follow the led suit.";
        else if(led && card.suit === led) why = "You must beat the card winning the trick if you can — that one doesn't.";
        else if(led && hand.some(c => c.suit === G.trump) && card.suit !== G.trump) why = "You're out of " + L.SUIT_NAME[led] + " — you must play trump.";
        setCall(why, true); render();
      }
    }
  }));
}
function renderPanel(){
  const panel = $("#panel");
  const phase = G.phase;
  if(phase === "auction" && G.turn === 0){
    const minBid = L.minLegalBid(G.currentBid);
    let opts = "";
    for(let v = minBid; v <= 200; v = v < 60 ? v + 1 : v + 5) opts += '<option value="' + v + '">' + v + '</option>';
    const marr = marriageSuits(G.hands[0]).map(s => L.SUIT_GLYPH[s] + " " + L.SUIT_NAME[s]).join(", ") || "none — careful, you can't name trump without one";
    panel.innerHTML = '<div class="pt">Your bid</div><div class="ps">' +
      (G.currentBid ? "High bid is <b>" + G.currentBid + "</b> (" + NAMES[G.highBidder] + "). " : "Open the auction. ") +
      "Bids start at 50. You hold a marriage in: <b>" + marr + "</b>. Best meld if trump were your strongest suit: <b>" + (bestTrumpFor(G.hands[0]) ? bestTrumpFor(G.hands[0]).meld : 0) + "</b>.</div>" +
      '<div class="btnrow"><select class="bidsel" id="bid-amt">' + opts + '</select>' +
      '<button class="btn gold" id="btn-bid">BID</button><button class="btn" id="btn-passbid">PASS</button></div>';

    $("#btn-passbid").addEventListener("click", humanPassBid);
  }
  else if(phase === "auction"){
    panel.innerHTML = '<div class="pt">Auction</div><div class="ps">' + (G.currentBid ? "High bid <b>" + G.currentBid + "</b> — " + NAMES[G.highBidder] + ". " : "") + NAMES[G.turn] + " is thinking…</div>";
  }
  else if(phase === "trump" && G.declarer === 0){
    const suits = marriageSuits(G.hands[0]);
    panel.innerHTML = '<div class="pt">Name your trump</div><div class="ps">You won the auction at <b>' + G.currentBid + '</b>. Trump must be a suit where you hold a marriage (K + Q). Your meld for each:</div>' +
      '<div class="suitgrid">' + L.SUITS.map(s => {
        const ok = suits.includes(s);

      }).join("") + '</div>';
    panel.querySelectorAll("[data-suit]").forEach(b => b.addEventListener("click", ()=>{ nameTrump(b.getAttribute("data-suit")); save(); render(); maybeAI(); }));
  }
  else if(phase === "trump"){
    panel.innerHTML = '<div class="pt">Trump</div><div class="ps">' + NAMES[G.declarer] + ' is naming trump…</div>';
  }
  else if(phase === "pass"){
    const partner = partnerOf(G.declarer);
    if(G.passStage === "toDeclarer" && partner === 0){
      panel.innerHTML = '<div class="pt">Pass 4 cards to ' + NAMES[G.declarer] + '</div><div class="ps">Trump is <b>' + L.SUIT_GLYPH[G.trump] + " " + L.SUIT_NAME[G.trump] + '</b>. Your partner won the bid — send trump and aces. Tap 4 cards in your hand (' + G.selected.length + '/4 picked).</div>' +
        '<div class="btnrow"><button class="btn gold big" id="btn-sendpass"' + (G.selected.length === 4 ? "" : " disabled") + '>SEND 4 CARDS</button></div>';
      const b = $("#btn-sendpass"); if(b) b.addEventListener("click", confirmPass);
    } else if(G.passStage === "return" && G.declarer === 0){
      panel.innerHTML = '<div class="pt">Send 4 cards back</div><div class="ps">Ace passed you 4 cards (marked NEW). You hold ' + G.hands[0].length + ' — pick any 4 to return (' + G.selected.length + '/4 picked). Keep your trump, aces and meld.</div>' +
        '<div class="btnrow"><button class="btn gold big" id="btn-sendpass"' + (G.selected.length === 4 ? "" : " disabled") + '>RETURN 4 CARDS</button></div>';
      const b = $("#btn-sendpass"); if(b) b.addEventListener("click", confirmPass);
    } else {
      panel.innerHTML = '<div class="pt">The pass</div><div class="ps">Partners are exchanging 4 cards across the table…</div>';
    }
  }
  else if(phase === "meld"){
    const lines = [0,1,2,3].map(p => '<div class="ml"><span><b>' + NAMES[p] + '</b>' + (p === G.declarer ? " (bidder)" : "") + '</span><span>' + G.melds[p].total + '</span></div>').join("");
    panel.innerHTML = '<div class="pt">Meld is down</div><div class="meldlines">' + lines +
      '<div class="ml"><span><b>Team totals</b></span><span>Us ' + G.meldTeamRaw[0] + " · Them " + G.meldTeamRaw[1] + '</span></div></div>' +
      '<div class="ps">Full meld cards are in the Meld sheet below. A side under 20 scores no meld.</div>' +
      '<div class="btnrow"><button class="btn gold big" id="btn-beginplay">PLAY THE HAND</button>' +
      (G.declarer === 0 ? '<button class="btn danger" id="btn-throwin">THROW IN (−' + G.currentBid + ')</button>' : "") + '</div>';
    $("#btn-beginplay").addEventListener("click", ()=>{ beginPlay(); });
    const tb = $("#btn-throwin"); if(tb) tb.addEventListener("click", ()=> forfeitHand("throwin"));
  }
  else if(phase === "score" || phase === "matchover"){
    const r = G.lastResult;
    const d0 = r.delta[0], d1 = r.delta[1];
    const fmt = d => '<b class="' + (d >= 0 ? "pos" : "neg") + '">' + (d >= 0 ? "+" : "") + d + '</b>';
    panel.innerHTML = '<div class="pt">' + (phase === "matchover" ? "Match over" : "Hand " + G.hand + " — scored") + '</div>' +
      '<div class="ps">' + r.note + '</div><div class="scorelines">' +
      '<div class="sl"><span>Us — You + Ace</span>' + fmt(d0) + '</div>' +
      '<div class="sl"><span>Them — Rex + Slim</span>' + fmt(d1) + '</div>' +
      '<div class="sl"><span>Match score</span><span><b>' + G.scores[0] + " · " + G.scores[1] + '</b></span></div></div>' +
      (phase === "matchover"
        ? '<div class="ps" style="font-size:17px"><b>' + (G.winner === 0 ? "🏆 You and Ace win the match!" : "Rex and Slim win the match.") + '</b></div><div class="btnrow"><button class="btn gold big" id="btn-newmatch2">NEW MATCH</button></div>'
        : '<div class="btnrow"><button class="btn gold big" id="btn-nexthand">DEAL THE NEXT HAND</button></div>');
    const nh = $("#btn-nexthand"); if(nh) nh.addEventListener("click", nextHand);
    const nm = $("#btn-newmatch2"); if(nm) nm.addEventListener("click", ()=>{ newMatch(); deal(); });
  }
  else panel.innerHTML = "";
}
/* ---------------- drag sheet ---------------- */
let sheetTab = "score", sheetSnap = 0;   // 0 collapsed, 1 half, 2 full
function sheetTransform(){
  const sh = $("#sheet");
  sh.style.transform = "translate(-50%," + (sheetSnap === 0 ? "calc(100% - 54px)" : sheetSnap === 1 ? "52%" : "0%") + ")";
}
function setSheet(snap, tab){
  if(typeof snap === "number") sheetSnap = snap;
  if(tab) sheetTab = tab;
  document.querySelectorAll("#sheet .tabs .btn").forEach(b => b.classList.toggle("on", b.getAttribute("data-tab") === sheetTab));
  sheetTransform(); renderSheet();
}
function meldTableHTML(){
  if(!G.melds) {
    const bt = bestTrumpFor(G.hands[0]);
    return "<h3>Your meld preview</h3><p>Meld is scored after the pass. Right now your strongest trump choice is <b>" +
      (bt ? L.SUIT_NAME[bt.suit] + " — meld " + bt.meld : "none (no marriage held)") + "</b>.</p>" +
      L.SUITS.map(s => "<p>" + L.SUIT_GLYPH[s] + " " + L.SUIT_NAME[s] + ": <b>" + L.computeMeld(G.hands[0], s).total + "</b></p>").join("");
  }
  let h = "<h3>Meld — Hand " + G.hand + " (" + L.SUIT_GLYPH[G.trump] + " trump)</h3>";
  for(let p = 0; p < 4; p++){
    h += "<p><b>" + NAMES[p] + "</b> — " + G.melds[p].total + "</p>";
    for(const ln of G.melds[p].lines) h += '<div class="meldlines"><div class="ml"><span>' + ln.label + '</span><span>' + ln.points + '</span></div></div>';
    if(!G.melds[p].lines.length) h += "<p>— no meld —</p>";
  }
  h += "<p><b>Team totals:</b> Us " + G.meldTeamRaw[0] + " · Them " + G.meldTeamRaw[1] + " (under 20 does not count)</p>";
  return h;
}
function renderSheet(){
  const body = $("#sheet-body"); if(!body || !G) return;
  if(sheetTab === "score"){
    let h = "<h3>Match — first to 500</h3><p><b>Us " + G.scores[0] + " · Them " + G.scores[1] + "</b></p>";
    if(G.history.length){
      h += "<table><tr><th>Hand</th><th>Bid</th><th>Us</th><th>Them</th></tr>" +
        G.history.slice().reverse().map(x => "<tr><td>" + x.hand + "</td><td>" + x.bid + " (" + NAMES[x.declarer] + (x.trump ? ", " + L.SUIT_GLYPH[x.trump] : "") + ")</td><td>" + (x.delta[0] >= 0 ? "+" : "") + x.delta[0] + "</td><td>" + (x.delta[1] >= 0 ? "+" : "") + x.delta[1] + "</td></tr>").join("") + "</table>";
    } else h += "<p>No hands scored yet.</p>";
    body.innerHTML = h;
  }
  else if(sheetTab === "meld") body.innerHTML = meldTableHTML();
  else body.innerHTML = RULES_HTML;
}
const RULES_HTML = "<h3>How to play — Hustle City Pinochle</h3>" +
"<p><b>Your team:</b> you and Ace (across the table) against Rex and Slim. First side to <b>500</b> wins the match. If both sides cross 500 on the same hand, the bidding side wins.</p>" +
"<p><b>The deck:</b> 80 cards — A, 10, K, Q, J in every suit, four copies of each, <b>no nines</b>. In a suit the order is A &gt; 10 &gt; K &gt; Q &gt; J. Everyone gets 20 cards.</p>" +
"<p><b>Auction:</b> bidding opens at <b>50</b>, rises by 1 up to 60, then in 5s (65, 70…). A pass is final. If the first three players pass, the dealer is stuck with the bid at 50.</p>" +
"<p><b>Trump:</b> the high bidder names trump — and must hold a <b>marriage (K + Q)</b> in that suit. No marriage anywhere means the hand is thrown in and the bidding side loses the bid.</p>" +
"<p><b>The pass:</b> the bidder's partner passes <b>4 cards</b> to the bidder, who sends <b>4 back</b>. Then meld is scored on the new hands.</p>" +
"<h3>Meld (per player, partners add together)</h3>" +
"<table><tr><th>Meld</th><th>1×</th><th>2×</th><th>3×</th><th>4×</th></tr>" +
"<tr><td>Run (A 10 K Q J of trump)</td><td>15</td><td>150</td><td>225</td><td>300</td></tr>" +
"<tr><td>Pinochle (J♦ + Q♠)</td><td>4</td><td>30</td><td>60</td><td>90</td></tr>" +
"<tr><td>Aces around</td><td>10</td><td>100</td><td>150</td><td>200</td></tr>" +
"<tr><td>Kings around</td><td>8</td><td>80</td><td>120</td><td>160</td></tr>" +
"<tr><td>Queens around</td><td>6</td><td>60</td><td>90</td><td>120</td></tr>" +
"<tr><td>Jacks around</td><td>4</td><td>40</td><td>60</td><td>80</td></tr></table>" +
"<p>Royal marriage (K+Q of trump) = <b>4 each</b>; marriage in a plain suit = <b>2 each</b>. A card can score once in each meld <i>type</i> (a Q♠ can be in a marriage, a pinochle and queens around at once). No dix — there are no nines. <b>A side's meld counts only if it totals 20 or more.</b> If the bidding side melds under 20, the hand is forfeit: the bid comes off and the defenders keep their meld.</p>" +
"<h3>Play</h3>" +
"<p>The bidder leads. You must <b>follow the led suit</b> if you can — and if you can beat the card currently winning the trick, you must (<i>crawl</i>). Out of the led suit? You must <b>trump</b>, and overtrump if you can. Of two identical cards, the first played wins. The game only ever offers you legal cards — a renege can't happen. Winners lead next.</p>" +
"<p><b>Counters:</b> every A, 10 and K your side captures is worth <b>1</b>, and the last trick is worth <b>2</b> — 50 trick points in every hand.</p>" +
"<h3>Scoring</h3>" +
"<p>A side must take <b>20+ trick points</b> to score anything. Bidding side: meld + tricks reaching the bid scores it all; short — or under 20 in tricks — and you're <b>set</b>: the bid is subtracted. Defenders score their meld + tricks when they take 20+.</p>" +
"<p>Your cards: the chrome Hustle City Deck. A small numbered badge marks which copy of a doubled card you're holding.</p>" +
"<div class='copy'>© 2026 Joshua Dawson / J-Dawgs Industries — Hustle City Pinochle™</div>";
/* sheet drag */
(function(){
  const handle = $("#sheet-handle"), sh = $("#sheet");
  let startY = 0, startSnap = 0, dragging = false;
  handle.addEventListener("pointerdown", e => { dragging = true; startY = e.clientY; startSnap = sheetSnap; handle.setPointerCapture(e.pointerId); });
  handle.addEventListener("pointermove", e => {
    if(!dragging) return;
    const dy = e.clientY - startY, H = sh.offsetHeight;
    const base = startSnap === 0 ? H - 54 : startSnap === 1 ? H * 0.52 : 0;
    let y = Math.max(0, Math.min(H - 54, base + dy));
    sh.style.transition = "none";
    sh.style.transform = "translate(-50%," + y + "px)";
  });
  const endDrag = e => {
    if(!dragging) return; dragging = false;
    sh.style.transition = "";
    const dy = e.clientY - startY;
    let snap = startSnap + (dy < -40 ? 1 : dy > 40 ? -1 : 0);
    snap = Math.max(0, Math.min(2, snap));
    setSheet(snap);
  };
  handle.addEventListener("pointerup", endDrag);
  handle.addEventListener("pointercancel", endDrag);
  handle.addEventListener("click", ()=>{ if(Math.abs(event.clientY - startY) < 6) setSheet(sheetSnap === 0 ? 1 : 0); });
  document.querySelectorAll("#sheet .tabs .btn").forEach(b => b.addEventListener("click", ()=> setSheet(sheetSnap === 0 ? 1 : sheetSnap, b.getAttribute("data-tab"))));
})();
/* ---------------- boot ---------------- */
$("#btn-rules").addEventListener("click", ()=> setSheet(2, "rules"));
$("#btn-newmatch").addEventListener("click", ()=>{ seq++; newMatch(); deal(); });
const saved = storeGet(SAVE_KEY);
if(saved && saved.phase && saved.phase !== "idle" && saved.hands && saved.hands[0]){
  G = saved;
  if(G.phase === "trickpause"){ G.phase = "play"; }   // resume mid-trick cleanly
  render(); maybeAI();
} else { newMatch(); deal(); }
})();
